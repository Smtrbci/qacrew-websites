<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Page Title -->
  <title>QAcrew | Coming Soon</title>

  <!-- CSS Codes -->
  <style>
    :root {
      --bg: #03131c;
      --bg2: #061f2b;
      --green: #0f8f68;
      --green-light: #18c28f;
      --white: #f7f7f7;
      --muted: #d7d7d7;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #02070b;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      overflow: hidden;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(circle at center, rgba(12, 70, 78, 0.35), transparent 45%),
        linear-gradient(135deg, var(--bg), var(--bg2), var(--bg));
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      border: 10px solid #02070b;
    }

    .camera-dot {
      position: absolute;
      top: 8px;
      left: 50%;
      width: 7px;
      height: 7px;
      transform: translateX(-50%);
      background: #111;
      border-radius: 50%;
      z-index: 10;
    }

    .logo {
      position: absolute;
      top: 9%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1px;
      text-shadow: 0 4px 8px rgba(0,0,0,.45);
      z-index: 5;
    }

    .logo span {
      color: var(--green-light);
    }

    .content {
      position: relative;
      z-index: 5;
      margin-top: 60px;
    }

    .spinner {
      width: 86px;
      height: 86px;
      margin: 0 auto 38px;
      border-radius: 50%;
      position: relative;
      animation: spin 2.8s linear infinite;
    }

    .spinner::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 6px solid rgba(255,255,255,.08);
      border-top-color: var(--green-light);
      border-right-color: rgba(24,194,143,.55);
      box-shadow:
        0 0 22px rgba(24,194,143,.45),
        inset 0 0 18px rgba(24,194,143,.18);
    }

    .spinner::after {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 4px dotted rgba(24,194,143,.85);
      animation: spinReverse 4.5s linear infinite;
    }

    h1 {
      font-size: clamp(42px, 7vw, 70px);
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 22px;
      text-shadow: 0 5px 8px rgba(0,0,0,.5);
    }

    .desc {
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.35;
      font-weight: 700;
      color: var(--muted);
      text-shadow: 0 4px 8px rgba(0,0,0,.45);
    }

    .desc span {
      color: var(--green-light);
    }

    .line {
      width: 135px;
      height: 4px;
      background: var(--green-light);
      margin: 32px auto 22px;
      border-radius: 999px;
      box-shadow: 0 0 16px rgba(24,194,143,.5);
    }

    .status {
      color: var(--green);
      font-size: clamp(18px, 2vw, 27px);
      font-weight: 900;
    }

    .wave {
      position: absolute;
      width: 900px;
      height: 280px;
      border-radius: 50%;
      opacity: .75;
      background:
        repeating-radial-gradient(
          ellipse at center,
          rgba(24,194,143,.42) 0px,
          rgba(24,194,143,.42) 1px,
          transparent 2px,
          transparent 7px
        );
      filter: blur(.4px);
      animation: waterWave 9s ease-in-out infinite alternate;
    }

    .wave-left {
      left: -410px;
      bottom: 100px;
      transform: rotate(20deg);
    }

    .wave-left-2 {
      left: -220px;
      bottom: -80px;
      transform: rotate(-10deg);
      opacity: .42;
      animation-duration: 12s;
    }

    .wave-right {
      right: -390px;
      bottom: -30px;
      transform: rotate(-9deg);
      opacity: .52;
      animation-duration: 11s;
    }

    .ripple {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      border: 1px solid rgba(24,194,143,.14);
      animation: rippleMove 10s ease-in-out infinite alternate;
    }

    .ripple.one {
      left: 8%;
      top: 18%;
    }

    .ripple.two {
      right: 8%;
      bottom: 12%;
      width: 520px;
      height: 520px;
      animation-duration: 13s;
    }

    .ripple.three {
      left: 40%;
      bottom: -180px;
      width: 620px;
      height: 620px;
      animation-duration: 15s;
      opacity: .7;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes spinReverse {
      to {
        transform: rotate(-360deg);
      }
    }

    @keyframes waterWave {
      from {
        transform: translateY(0) translateX(0) rotate(18deg) scale(1);
      }
      to {
        transform: translateY(-32px) translateX(24px) rotate(22deg) scale(1.04);
      }
    }

    @keyframes rippleMove {
      from {
        transform: translateY(0) scale(1);
        opacity: .35;
      }
      to {
        transform: translateY(-38px) scale(1.08);
        opacity: .75;
      }
    }

    @media (max-width: 600px) {
      .screen {
        border: 5px solid #02070b;
      }

      .logo {
        font-size: 25px;
      }

      .spinner {
        width: 72px;
        height: 72px;
      }

      .spinner::after {
        inset: 15px;
      }
    }
  </style>
</head>

<body>
  <!-- HTML Codes -->
  <main class="screen">
    <div class="camera-dot"></div>

    <div class="logo">QA<span>crew</span></div>

    <div class="ripple one"></div>
    <div class="ripple two"></div>
    <div class="ripple three"></div>

    <div class="wave wave-left"></div>
    <div class="wave wave-left-2"></div>
    <div class="wave wave-right"></div>

    <section class="content">
      <div class="spinner"></div>

      <h1>COMING SOON</h1>

      <div class="desc">
        A better <span>QA</span> experience<br />
        is on the way.
      </div>

      <div class="line"></div>

      <div class="status">Stay tuned for updates!</div>
    </section>
  </main>
</body>
</html>
